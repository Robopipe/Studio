services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robopipe
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/robopipe
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/database/node_modules
      - /app/packages/schema/node_modules
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    ports:
      - "5173:5173"
    environment:
      VITE_STUDIO_API_BASE_URL: http://localhost:3000/v1
      VITE_WEB_BASE_URL: http://localhost:5173
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/schema/node_modules
    depends_on:
      - api

  ml:
    build:
      context: ./apps/ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      WEBHOOK_URL: http://api:3000/models/
    env_file:
      - ./apps/ml/.env
    volumes:
      - ml-export:/app/export
      - ml-dataset:/app/dataset
    depends_on:
      - api

volumes:
  pgdata:
  ml-export:
  ml-dataset:
