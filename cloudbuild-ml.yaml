steps:
  - name: "gcr.io/kaniko-project/executor:latest"
    args:
      - "--dockerfile=Dockerfile"
      - "--context=/workspace/apps/ml"
      - "--destination=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/ml:${SHORT_SHA}"
      - "--destination=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/ml:latest"
      - "--cache=true"
      - "--cache-ttl=168h"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run jobs update ${_JOB_NAME} \
          --image ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/ml:${SHORT_SHA} \
          --region ${_REGION}

options:
  logging: CLOUD_LOGGING_ONLY
